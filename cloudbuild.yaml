steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "-t",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-sales-repo-arnab-ghosh/cloud-run-app:$SHORT_SHA",
        ".",
      ]
    id: "Build Docker image"

  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "${_REGION}-docker.pkg.dev/$PROJECT_ID/ml-sales-repo-arnab-ghosh/cloud-run-app:$SHORT_SHA",
      ]
    id: "Push to Artifact Registry"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: "gcloud"
    args:
      [
        "deploy",
        "releases",
        "create",
        "release-$SHORT_SHA",
        "--image",
        "${_REGION}-docker.pkg.dev/faa-gcp-training-14-kfa-0808/ml-sales-repo-arnab-ghosh/cloud-run-app:$SHORT_SHA",
        "--region",
        "${_REGION}",
        "--delivery-pipeline",
        "cloud-run-arnab-ghosh-ml-sales-pipeline",
        "--platform",
        "managed",
        "--timeout",
        "600s",
        "--allow-unauthenticated",
        "--set-env-vars",
        "VERSION=$SHORT_SHA",
      ]

options:
  defaultLogsBucketBehavior: REGIONAL_USER_OWNED_BUCKET
# substitutions:
#   _SERVICE_NAME: cloud-run-app
