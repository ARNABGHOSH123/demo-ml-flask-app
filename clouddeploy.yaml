apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: cloud-run-arnab-ghosh-ml-sales-pipeline
description: ML Sales pipeline for Dev with Canary rollout
serialPipeline:
  stages:
    - targetId: dev
      profiles: []
      strategy:
        canary:
          runtimeConfig:
            cloudRun:
              automaticTrafficControl: true
          canaryDeployment:
            percentages: [25, 75]
            verify: true

---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: dev
description: Cloud Run development service
run:
  location: us-central1
